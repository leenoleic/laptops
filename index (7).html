<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricelist</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:8px;font:14px/1.35 Arial,Helvetica,sans-serif;color:#000;background:#fff}
#q{display:block;width:100%;max-width:360px;margin:0 0 10px;padding:8px 10px;border:1px solid #000;border-radius:0;font:inherit;color:#000;background:#fff}
.scroll{overflow:auto;max-height:90vh}
table{width:100%;border-collapse:collapse;min-width:900px}
th{position:sticky;top:0;background:#eee;text-align:center;font-weight:700;padding:10px 8px;border:1px solid #e2e2e2}
td{padding:8px;border:1px solid #e2e2e2;vertical-align:middle}
tr:nth-child(even) td{background:#f8f8f8}
.t-image{width:70px;text-align:center}
.t-image img{width:60px;height:60px;object-fit:contain;display:block;margin:0 auto}
.t-price,.t-number{text-align:right;white-space:nowrap}
.t-center{text-align:center}
.t-bold{font-weight:700}
.li{padding-left:10px;text-indent:-10px}
.li:before{content:"› ";}
#msg{padding:20px;text-align:center}
</style>
</head>
<body>
<input id="q" type="search" placeholder="Search" aria-label="Search">
<div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
<div id="msg" hidden></div>

<script>
/* Google Sheet > File > Share > Publish to web > your tab > CSV > Publish. Paste the link here. */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2UzKuE1c_APrTsaBBXQP71gBLciz4CzlMLhmc1hdun567e5UGEzE7yIOAsD8a8nDnueWeS0WL70p0/pub?gid=85522891&single=true&output=csv";
const CURRENCY = "₱";

/* SHEET LAYOUT
   Row 1 = column titles (anything you like)
   Row 2 = column type keyword (case doesn't matter, the word "type" is optional)
   Row 3 and below = your products
   Types: text | image | list | price | number | center | bold | hide
   image = paste a photo URL   list = separate items with a comma, Alt+Enter (new line) or |
   price = shows ₱ and commas   hide = column is not shown but is still searchable */

const SAMPLE = `Photo,Status,Brand,Model,Cash Price,SRP,CPU,RAM,SSD
imageType,centerType,textType,listType,priceType,priceType,listType,listType,textType
,EN ROUTE,HP,14-EP0445TU|D07C0PA,35700,37990,INTEL I3-1315U,8GB DDR4|up to 32GB max,512GB
,ON HAND,ASUS,VIVOBOOK 14|X1404VA-EB2264WSM,39000,40995,Intel Core 3-100U,8GB LPDDR5 OB|up to 16GB max,512GB
,ON HAND,ACER,ASPIRE LITE 14|AL14-47P-R9CQ,41000,41999,Ryzen 5-3500U,8GB DDR4,512GB`;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parseCSV(t){
  const out=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){row.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);out.push(row);row=[];f=""}
    else f+=c}
  if(f||row.length){row.push(f);out.push(row)}
  return out;
}
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,""));return isNaN(n)?null:n};
const fmt=n=>n.toLocaleString("en-PH",{maximumFractionDigits:2});
let COLS=[],ROWS=[];

function cell(type,v){
  v=(v||"").trim();
  switch(type){
    case "image": return v?`<img src="${esc(v)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:"";
    case "list": return v.split(/\r?\n|\||,(?!\d)/).map(x=>x.trim()).filter(Boolean).map(x=>`<div class="li">${esc(x)}</div>`).join("");
    case "price": {const n=num(v);return n==null?esc(v):CURRENCY+" "+fmt(n)}
    case "number": {const n=num(v);return n==null?esc(v):fmt(n)}
    default: return esc(v);
  }
}
function render(){
  const t=$("q").value.toLowerCase().trim();
  const vis=COLS.filter(c=>c.type!=="hide");
  const list=ROWS.filter(r=>!t||r.some((v,i)=>COLS[i]&&COLS[i].type!=="image"&&String(v).toLowerCase().includes(t)));
  $("head").innerHTML="<tr>"+vis.map(c=>`<th>${esc(c.title)}</th>`).join("")+"</tr>";
  $("rows").innerHTML=list.map(r=>"<tr>"+vis.map(c=>`<td class="t-${c.type}">${cell(c.type,r[c.i])}</td>`).join("")+"</tr>").join("");
  $("msg").hidden=list.length>0;$("msg").textContent="No products match.";
}
async function init(){
  let csv=SAMPLE;
  if(SHEET_CSV_URL){
    try{const r=await fetch(SHEET_CSV_URL);if(!r.ok)throw 0;csv=await r.text()}
    catch(e){$("msg").hidden=false;$("msg").textContent="Couldn't load the Google Sheet. Check that it is published to the web as CSV.";return}
  }
  const rows=parseCSV(csv);
  const titles=rows[0]||[],types=rows[1]||[];
  COLS=titles.map((title,i)=>({i,title:title.trim(),type:title.trim()?(((types[i]||"text").trim().toLowerCase().replace(/type$/,""))||"text"):"hide"}));
  ROWS=rows.slice(2).filter(r=>r.some(x=>x.trim()));
  render();
}
$("q").addEventListener("input",render);
init();
</script>
</body>
</html>
